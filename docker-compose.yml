# Runs the FastAPI service and the Streamlit dashboard together.
#   docker compose up --build
# API:       http://localhost:8000/docs
# Dashboard: http://localhost:8501
services:
  api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build: .
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment:
      # Point the dashboard's live-prediction form at the API service.
      CHURN_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
